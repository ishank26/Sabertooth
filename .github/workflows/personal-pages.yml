name: Deploy Sabertooth Personal

on:
  push:
    branches: [master]
    paths:
      - "personal/**"
      - ".github/workflows/personal-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sabertooth-personal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: personal
      - name: Deploy Sabertooth Personal
        id: deployment
        uses: actions/deploy-pages@v4
