name: Sabertooth CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - "fork/**"
      - "rewrite/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Personal PWA JavaScript syntax
        run: |
          node --input-type=module --check < personal/app.js
          node --input-type=module --check < personal/program.js
          node --input-type=module --check < personal/storage.js
          node --check personal/sw.js
      - name: Check Personal PWA required assets
        run: |
          test -f personal/index.html
          test -f personal/manifest.webmanifest
          test -f personal/icon.svg
          grep -q 'sabertooth-personal-backup' personal/storage.js
          grep -q 'serviceWorker' personal/app.js
      - run: npm ci
      - name: Prepare generated sources
        run: |
          npm run ensure:localdomain
          npm run build:markdown
          npm run build:programs
          npm run build:exercises
      - run: npm run check:lambda
      - run: npx mocha -r ts-node/register --timeout 0 test/freeAccess.test.ts test/serviceConfig.test.ts test/appFreeAccess.test.ts
